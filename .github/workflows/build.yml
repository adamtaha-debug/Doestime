name: Build Dose Time APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter App and Build
        run: |
          flutter create app_build --project-name dosetime --org com.adamvision.dosetime
          cp main.dart app_build/lib/main.dart
          cd app_build
          flutter pub add shared_preferences
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoseTime-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
